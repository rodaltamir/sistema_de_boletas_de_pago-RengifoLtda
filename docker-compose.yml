version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rengifo_db
    restart: always
    environment:
      POSTGRES_USER: admin_rengifo
      POSTGRES_PASSWORD: rengifo_planillaspago-826
      POSTGRES_DB: db_planillas_pago_rengifo
    ports:
      - "5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rengifo_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: rengifo_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rengifo.com
      PGADMIN_DEFAULT_PASSWORD: rengifo_planillaspago-826
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - rengifo_network

networks:
  rengifo_network:
    driver: bridge

volumes:
  pgdata:
